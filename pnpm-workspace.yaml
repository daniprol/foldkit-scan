# pnpm 11+ keeps its settings here.
# The library is the root package. The docs site is a second package, so it
# can use TypeScript 6 (TypeDoc needs its compiler API) while the root stays
# on TypeScript 7.
#
# '.' lists the root too. pnpm includes it anyway, but changesets only
# versions packages listed here.
packages:
  - '.'
  - docs

# Wait one day before installing a brand-new release (supply-chain safety).
# 1440 minutes is already the default. Writing it down makes it visible.
minimumReleaseAge: 1440

# pnpm blocks dependency install scripts unless they are listed here.
# Add an entry only when `pnpm install` names a package and asks.
allowBuilds: {}
